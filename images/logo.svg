<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#ED1C24" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Group containing Logo Graphics -->
  <g id="dragon-logo" transform="translate(0, 10)">
    
    <!-- Thorny Vine Shield Outline (Red #ED1C24 with Black Border) -->
    <g stroke="#090C11" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
      <!-- Left Stem -->
      <path d="M 290 435 C 240 370, 170 270, 175 210" fill="none" stroke="#ED1C24" stroke-width="16"/>
      <!-- Right Stem -->
      <path d="M 310 435 C 360 370, 430 270, 425 210" fill="none" stroke="#ED1C24" stroke-width="16"/>

      <!-- Thorny Spikes on Left Stem -->
      <path d="M 185 240 L 155 230 L 180 265 Z" fill="#ED1C24"/>
      <path d="M 205 285 L 175 280 L 200 310 Z" fill="#ED1C24"/>
      <path d="M 230 330 L 200 330 L 225 355 Z" fill="#ED1C24"/>
      <path d="M 255 375 L 230 380 L 250 400 Z" fill="#ED1C24"/>

      <!-- Thorny Spikes on Right Stem -->
      <path d="M 415 240 L 445 230 L 420 265 Z" fill="#ED1C24"/>
      <path d="M 395 285 L 425 280 L 400 310 Z" fill="#ED1C24"/>
      <path d="M 370 330 L 400 330 L 375 355 Z" fill="#ED1C24"/>
      <path d="M 345 375 L 370 380 L 350 400 Z" fill="#ED1C24"/>
    </g>

    <!-- LEFT DRAGON HEAD & WHISKERS -->
    <g transform="translate(0,0)">
      <!-- Dragon Whisker Loops Left -->
      <path d="M 140 160 C 90 120, 110 50, 180 60 C 230 70, 240 100, 290 80" fill="none" stroke="#ED1C24" stroke-width="14" stroke-linecap="round"/>
      <path d="M 140 160 C 90 120, 110 50, 180 60 C 230 70, 240 100, 290 80" fill="none" stroke="#090C11" stroke-width="4" stroke-linecap="round"/>
      
      <!-- Dragon Head Left Base -->
      <path d="M 130 190 C 120 150, 150 110, 210 100 C 260 90, 285 130, 280 170 C 260 210, 180 230, 130 190 Z" fill="#ED1C24" stroke="#090C11" stroke-width="5"/>
      <!-- Snout & Spikes -->
      <path d="M 110 170 L 140 145 L 160 160 L 140 180 Z" fill="#ED1C24" stroke="#090C11" stroke-width="4"/>
      <path d="M 125 195 L 105 190 L 130 210 Z" fill="#ED1C24" stroke="#090C11" stroke-width="4"/>
      <path d="M 145 210 L 120 215 L 145 230 Z" fill="#ED1C24" stroke="#090C11" stroke-width="4"/>
      <!-- Eye & Teeth Left -->
      <circle cx="210" cy="140" r="10" fill="#090C11"/>
      <circle cx="212" cy="138" r="3" fill="#FFFFFF"/>
      <!-- Open Mouth & Sharp Teeth -->
      <path d="M 140 175 C 170 170, 210 185, 240 175 C 220 205, 170 210, 140 175 Z" fill="#090C11"/>
      <polygon points="150,175 155,188 160,175" fill="#FFFFFF"/>
      <polygon points="165,175 170,190 175,175" fill="#FFFFFF"/>
      <polygon points="180,175 185,188 190,175" fill="#FFFFFF"/>
      <polygon points="195,175 200,188 205,175" fill="#FFFFFF"/>
      <!-- Dragon Mane Spikes Left -->
      <path d="M 230 105 L 245 80 L 255 110 Z" fill="#090C11"/>
      <path d="M 255 115 L 275 90 L 275 125 Z" fill="#090C11"/>
      <path d="M 275 130 L 295 110 L 285 145 Z" fill="#090C11"/>
    </g>

    <!-- RIGHT DRAGON HEAD & WHISKERS (MIRRORED) -->
    <g transform="translate(600,0) scale(-1,1)">
      <!-- Dragon Whisker Loops Right -->
      <path d="M 140 160 C 90 120, 110 50, 180 60 C 230 70, 240 100, 290 80" fill="none" stroke="#ED1C24" stroke-width="14" stroke-linecap="round"/>
      <path d="M 140 160 C 90 120, 110 50, 180 60 C 230 70, 240 100, 290 80" fill="none" stroke="#090C11" stroke-width="4" stroke-linecap="round"/>
      
      <!-- Dragon Head Right Base -->
      <path d="M 130 190 C 120 150, 150 110, 210 100 C 260 90, 285 130, 280 170 C 260 210, 180 230, 130 190 Z" fill="#ED1C24" stroke="#090C11" stroke-width="5"/>
      <!-- Snout & Spikes -->
      <path d="M 110 170 L 140 145 L 160 160 L 140 180 Z" fill="#ED1C24" stroke="#090C11" stroke-width="4"/>
      <path d="M 125 195 L 105 190 L 130 210 Z" fill="#ED1C24" stroke="#090C11" stroke-width="4"/>
      <path d="M 145 210 L 120 215 L 145 230 Z" fill="#ED1C24" stroke="#090C11" stroke-width="4"/>
      <!-- Eye & Teeth Right -->
      <circle cx="210" cy="140" r="10" fill="#090C11"/>
      <circle cx="212" cy="138" r="3" fill="#FFFFFF"/>
      <!-- Open Mouth & Sharp Teeth -->
      <path d="M 140 175 C 170 170, 210 185, 240 175 C 220 205, 170 210, 140 175 Z" fill="#090C11"/>
      <polygon points="150,175 155,188 160,175" fill="#FFFFFF"/>
      <polygon points="165,175 170,190 175,175" fill="#FFFFFF"/>
      <polygon points="180,175 185,188 190,175" fill="#FFFFFF"/>
      <polygon points="195,175 200,188 205,175" fill="#FFFFFF"/>
      <!-- Dragon Mane Spikes Right -->
      <path d="M 230 105 L 245 80 L 255 110 Z" fill="#090C11"/>
      <path d="M 255 115 L 275 90 L 275 125 Z" fill="#090C11"/>
      <path d="M 275 130 L 295 110 L 285 145 Z" fill="#090C11"/>
    </g>

    <!-- CENTER EMBLEM: FLAME, BLACK FIST, DRAGON SILHOUETTE -->
    <!-- Red Flame -->
    <path d="M 262 210 C 255 220 252 230 262 242 C 270 230 272 225 262 210 Z" fill="#ED1C24"/>
    <path d="M 262 218 C 258 224 257 228 262 235 C 266 228 267 225 262 218 Z" fill="#FF5252"/>

    <!-- Black Fist -->
    <g transform="translate(262, 265)">
      <!-- Clenched Knuckles -->
      <path d="M -30 -15 L 20 -15 C 32 -15 36 -5 34 8 L 30 22 C 28 32 18 36 -5 36 L -25 36 C -35 36 -38 25 -36 10 L -34 -5 C -33 -12 -32 -15 -30 -15 Z" fill="#090C11" stroke="#FFFFFF" stroke-width="2.5"/>
      <!-- Finger Separations -->
      <line x1="-15" y1="-15" x2="-15" y2="15" stroke="#FFFFFF" stroke-width="2.5"/>
      <line x1="0" y1="-15" x2="0" y2="15" stroke="#FFFFFF" stroke-width="2.5"/>
      <line x1="15" y1="-15" x2="15" y2="15" stroke="#FFFFFF" stroke-width="2.5"/>
      <!-- Wrapped Thumb -->
      <path d="M -32 10 Q -5 28 28 15" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Mini Dragon Silhouette Right of Fist -->
    <path d="M 315 255 Q 330 245 325 260 Q 340 255 330 270 Q 345 275 320 285 Q 330 295 315 290 Z" fill="#090C11"/>

  </g> <!-- End Logo Graphics -->

  <!-- TYPOGRAPHY BELOW LOGO -->
  <!-- IMMORTALS -->
  <text x="300" y="500" font-family="'Oswald', 'Arial Black', sans-serif" font-weight="900" font-size="52" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">IMMORTALS</text>

  <!-- MARTIAL ARTS & FITNESS ACADEMY -->
  <text x="300" y="535" font-family="'Inter', sans-serif" font-weight="700" font-size="18" fill="#A8B1BF" text-anchor="middle" letter-spacing="2.5">MARTIAL ARTS &amp; FITNESS ACADEMY</text>

</svg>
